<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Edu+AU+VIC+WA+NT+Hand:wght@400..700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="spa.css">

    <!-- Local Bootstrap CSS -->
    <link rel="stylesheet" href="bootstrap-5.3.3-dist/css/bootstrap.min.css" />
    <!-- jQuery (required for Bootstrap JS) -->
    <script src="https://code.jquery.com/jquery-3.1.0.min.js"></script>
    <!-- Local Bootstrap JS -->
    <script src="bootstrap-5.3.3-dist/js/bootstrap.min.js"></script>
    <!-- Custom Stylesheet -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Caffeine Craze - Login & Checkout</title>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <img src="Cafe-logo.png" alt="Cafe Logo" style="border-style: groove; border-color: black; height:80px;width:80px">
                Caffeine Craze
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            <img src="homeicon.png" alt="Home Icon" class="navbar-icon"> Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="product.html">
                            <img src="menuicon.png" alt="Menu Icon" class="navbar-icon"> Menu
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contact_me.html">
                            <img src="carticon.png" alt="Cart Icon" class="navbar-icon"> Order Now
                        </a>
                    </li>
                    <li class="nav-item" id="auth-nav-item">
                        <a class="nav-link" href="#" id="auth-link">
                            <img src="usericon.png" alt="User Icon" class="navbar-icon"> Login
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1 class="heading fade-in">Login to Your Account</h1>
        
        <div class="form-container fade-in">
            <ul class="nav nav-tabs" id="orderTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-content" type="button">Login</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register-content" type="button">Register</button>
                </li>
            </ul>

            <div class="tab-content" id="orderTabsContent">
                <!-- Login View -->
                <div class="tab-pane fade show active" id="login-content" role="tabpanel" aria-labelledby="login-tab">
                    <div id="login-view" class="app-view">
                        <div class="alert alert-danger" id="error-message" style="display: none;"></div>
                        <div class="alert alert-success" id="success-message" style="display: none;"></div>
                        
                        <div id="loginForm" class="login-form">
                            <form class="row g-3" id="login-form">
                                <div class="col-12">
                                    <label class="form-label">Email</label>
                                    <input type="email" class="form-control" id="email" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Password</label>
                                    <input type="password" class="form-control" id="password" required>
                                </div>
                                <div class="col-12 mt-4">
                                    <button type="submit" class="login-button">Login</button>
                                </div>
                            </form>
                            
                            <div class="divider">
                                <span>OR</span>
                            </div>
                            
                            <div class="social-login">
                                <button id="google-login" class="google-button">
                                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo">
                                    Sign in with Google
                                </button>
                            </div>
                            
                            <div class="register-section">
                                <p><a href="#" id="forgot-password">Forgot Password?</a></p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Register View -->
                <div class="tab-pane fade" id="register-content" role="tabpanel" aria-labelledby="register-tab">
                    <div id="register-view" class="app-view">
                        <div class="alert alert-danger" id="register-error-message" style="display: none;"></div>
                        <div class="alert alert-success" id="register-success-message" style="display: none;"></div>
                        
                        <div id="registerForm" class="login-form">
                            <form class="row g-3" id="register-form">
                                <div class="col-md-6">
                                    <label class="form-label">First Name</label>
                                    <input type="text" class="form-control" id="firstName" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Last Name</label>
                                    <input type="text" class="form-control" id="lastName" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Email</label>
                                    <input type="email" class="form-control" id="register-email" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Password</label>
                                    <input type="password" class="form-control" id="register-password" required>
                                    <small class="text-muted">Password must be at least 6 characters long</small>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Confirm Password</label>
                                    <input type="password" class="form-control" id="confirmPassword" required>
                                </div>
                                <div class="col-12 mt-4">
                                    <button type="submit" class="login-button">Register</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script type="module" src="spa.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
