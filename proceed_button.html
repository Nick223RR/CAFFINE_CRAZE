    <script src="cart.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize cart display
            displayCart();
            
            // Event listeners
            document.getElementById('checkout-btn').addEventListener('click', function() {
                document.querySelector('.form-container').style.display = 'none';
                document.getElementById('checkout-container').style.display = 'block';
            });
            
            document.getElementById('continue-shopping-btn').addEventListener('click', function() {
                window.location.href = 'product.html';
            });
            
            document.getElementById('back-to-cart-btn').addEventListener('click', function() {
                document.querySelector('.form-container').style.display = 'block';
                document.getElementById('checkout-container').style.display = 'none';
            });
            
            document.getElementById('delivery-form').addEventListener('submit', function(e) {
                e.preventDefault();
                alert('Thank you for your order! Your delicious items will be delivered soon.');
                CartManager.clearCart();
                window.location.href = 'index.html';
            });
        });
        
        // Display cart items
        function displayCart() {
            const cartItemsContainer = document.getElementById('cart-items-container');
            const cartSummaryItems = document.getElementById('cart-summary-items');
            const cartTotal = document.getElementById('cart-total');
            const cart = CartManager.getCart();
            
            if (cart.length === 0) {
                cartItemsContainer.innerHTML = `
                    <div class="cart-empty">
                        <h3>Your cart is empty</h3>
                        <p>Looks like you haven't added any items to your cart yet.</p>
                        <a href="product.html" class="btn btn-primary mt-3">Browse Menu</a>
                    </div>
                `;
                cartSummaryItems.innerHTML = '';
                cartTotal.textContent = 'Total: ₹0';
                return;
            }
            
            let cartItemsHTML = '';
            let cartSummaryHTML = '';
            let total = 0;
            
            cart.forEach(item => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;
                
                cartItemsHTML += `
                    <div class="cart-item" data-id="${item.id}">
                        <div class="cart-item-details">
                            <div class="cart-item-name">${item.name}</div>
                            <div class="cart-item-price">₹${item.price}</div>
                        </div>
                        <div class="cart-quantity-control">
                            <button class="cart-quantity-btn decrease-quantity" data-id="${item.id}">-</button>
                            <span class="cart-quantity-display">${item.quantity}</span>
                            <button class="cart-quantity-btn increase-quantity" data-id="${item.id}">+</button>
                        </div>
                        <div>
                            <button class="cart-item-remove" data-id="${item.id}">Remove Item</button>
                        </div>
                    </div>
                `;
                
                cartSummaryHTML += `
                    <div class="d-flex justify-content-between mb-2">
                        <span>${item.name} x ${item.quantity}</span>
                        <span>₹${itemTotal}</span>
                    </div>
                `;
            });
            
            cartItemsContainer.innerHTML = cartItemsHTML;
            cartSummaryItems.innerHTML = cartSummaryHTML;
            cartTotal.textContent = `Total: ₹${total}`;
            
            // Add event listeners for quantity buttons
            document.querySelectorAll('.increase-quantity').forEach(button => {
                button.addEventListener('click', function() {
                    const id = parseInt(this.dataset.id);
                    const item = cart.find(item => item.id === id);
                    CartManager.updateQuantity(id, item.quantity + 1);
                    displayCart();
                });
            });
            
            document.querySelectorAll('.decrease-quantity').forEach(button => {
                button.addEventListener('click', function() {
                    const id = parseInt(this.dataset.id);
                    const item = cart.find(item => item.id === id);
                    if (item.quantity > 1) {
                        CartManager.updateQuantity(id, item.quantity - 1);
                    } else {
                        CartManager.removeItem(id);
                    }
                    displayCart();
                });
            });
            
            document.querySelectorAll('.cart-item-remove').forEach(button => {
                button.addEventListener('click', function() {
                    const id = parseInt(this.dataset.id);
                    CartManager.removeItem(id);
                    displayCart();
                });
            });
        }
    </script>
