<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Edu+AU+VIC+WA+NT+Hand:wght@400..700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="cart.css">
    <style>
        /* Reset and Basic Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            min-height: 100vh;
            color: #333;
            line-height: 1.6;
        }

        .container {
            margin-top: 50px;
            padding: 20px;
        }

        .heading {
            font-family: 'Dancing Script', cursive;
            font-size: 36px;
            color: rgb(120, 50, 50);
            text-align: center;
            margin-bottom: 40px;
        }

        .cart-summary {
            position: sticky;
            top: 80px;
            background-color: rgb(254, 254, 254, 0.5);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            z-index: 1;
        }

        .item-price {
            font-weight: bold;
            color: rgb(120, 50, 50);
        }

        .btn {
            border-radius: 5px;
            padding: 10px 25px;
            font-size: 16px;
        }

        .btn-primary {
            background-color: rgb(120, 50, 50);
            border: none;
        }

        .btn-primary:hover {
            background-color: rgb(90, 30, 30);
        }

        .btn-secondary {
            background-color: #f8f9fa;
            color: #333;
            border: 1px solid #ddd;
        }

        .btn-secondary:hover {
            background-color: #e9ecef;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <img src="Cafe-logo.png" alt="Cafe Logo" style="border-style: groove; border-color: black; height:80px;width:80px">
                Caffeine Craze
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            <img src="homeicon.png" alt="Home Icon" class="navbar-icon"> Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="product.html">
                            <img src="menuicon.png" alt="Menu Icon" class="navbar-icon"> Menu
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="proceed_button.html">
                            <div class="cart-count-badge">
                                <img src="carticon.png" alt="Cart Icon" class="navbar-icon"> 
                                Order Now
                                <span id="cart-count">0</span>
                            </div>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1 class="heading fade-in">Your Shopping Cart</h1>
        
        <div class="form-container fade-in">
            <div class="row">
                <div class="col-md-8">
                    <div id="cart-items-container">
                        <!-- Cart items will be displayed here -->
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="cart-summary">
                        <h3>Order Summary</h3>
                        <div id="cart-summary-items"></div>
                        <hr>
                        <div id="cart-total" class="h4"></div>
                        <button class="btn btn-primary w-100 mt-3" id="checkout-btn">Proceed to Checkout</button>
                        <button class="btn btn-secondary w-100 mt-3" id="continue-shopping-btn">Continue Shopping</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container" id="checkout-container" style="display: none;">
        <h1 class="heading fade-in">Checkout</h1>
        
        <div class="form-container fade-in">
            <div id="addressForm" class="delivery-address">
                <h3>Delivery Address</h3>
                <div class="address-type-selector">
                    <label>
                        <input type="radio" name="addressType" value="home" checked> Home
                    </label>
                    <label>
                        <input type="radio" name="addressType" value="office"> Office
                    </label>
                    <label>
                        <input type="radio" name="addressType" value="other"> Other
                    </label>
                </div>
                <form class="row g-3" id="delivery-form">
                    <div class="col-md-6">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" class="form-control" pattern="[0-9]{10}" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Street Address</label>
                        <input type="text" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">City</label>
                        <select class="form-select" required>
                            <option value="">Select City</option>
                            <option>Chandigarh</option>
                            <option>Mohali</option>
                            <option>Panchkula</option>
                            <option>Zirakpur</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Area/Locality</label>
                        <input type="text" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Pin Code</label>
                        <input type="text" class="form-control" pattern="[0-9]{6}" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Landmark (Optional)</label>
                        <input type="text" class="form-control">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Delivery Instructions (Optional)</label>
                        <textarea class="form-control" rows="2" placeholder="Any specific instructions for delivery"></textarea>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary w-100">Confirm Order</button>
                        <button type="button" class="btn btn-secondary w-100 mt-3" id="back-to-cart-btn">Back to Cart</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="cart.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize cart display
            displayCart();
            
            // Event listeners
            document.getElementById('checkout-btn').addEventListener('click', function() {
                document.querySelector('.form-container').style.display = 'none';
                document.getElementById('checkout-container').style.display = 'block';
            });
            
            document.getElementById('continue-shopping-btn').addEventListener('click', function() {
                window.location.href = 'product.html';
            });
            
            document.getElementById('back-to-cart-btn').addEventListener('click', function() {
                document.querySelector('.form-container').style.display = 'block';
                document.getElementById('checkout-container').style.display = 'none';
            });
            
            document.getElementById('delivery-form').addEventListener('submit', function(e) {
                e.preventDefault();
                alert('Thank you for your order! Your delicious items will be delivered soon.');
                CartManager.clearCart();
                window.location.href = 'index.html';
            });
        });
        
        // Display cart items
        function displayCart() {
            const cartItemsContainer = document.getElementById('cart-items-container');
            const cartSummaryItems = document.getElementById('cart-summary-items');
            const cartTotal = document.getElementById('cart-total');
            const cart = CartManager.getCart();
            
            if (cart.length === 0) {
                cartItemsContainer.innerHTML = `
                    <div class="cart-empty">
                        <h3>Your cart is empty</h3>
                        <p>Looks like you haven't added any items to your cart yet.</p>
                        <a href="product.html" class="btn btn-primary mt-3">Browse Menu</a>
                    </div>
                `;
                cartSummaryItems.innerHTML = '';
                cartTotal.textContent = 'Total: ₹0';
                return;
            }
            
            let cartItemsHTML = '';
            let cartSummaryHTML = '';
            let total = 0;
            
            cart.forEach(item => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;
                
                cartItemsHTML += `
                    <div class="cart-item" data-id="${item.id}">
                        <div class="cart-item-details">
                            <div class="cart-item-name">${item.name}</div>
                            <div class="cart-item-price">₹${item.price}</div>
                        </div>
                        <div class="cart-quantity-control">
                            <button class="cart-quantity-btn decrease-quantity" data-id="${item.id}">-</button>
                            <span class="cart-quantity-display">${item.quantity}</span>
                            <button class="cart-quantity-btn increase-quantity" data-id="${item.id}">+</button>
                        </div>
                        <div>
                            <span class="item-price">₹${itemTotal}</span>
                            <button class="cart-item-remove" data-id="${item.id}">Remove</button>
                        </div>
                    </div>
                `;
                
                cartSummaryHTML += `
                    <div class="d-flex justify-content-between mb-2">
                        <span>${item.name} x ${item.quantity}</span>
                        <span>₹${itemTotal}</span>
                    </div>
                `;
            });
            
            cartItemsContainer.innerHTML = cartItemsHTML;
            cartSummaryItems.innerHTML = cartSummaryHTML;
            cartTotal.textContent = `Total: ₹${total}`;
            
            // Add event listeners for quantity buttons
            document.querySelectorAll('.increase-quantity').forEach(button => {
                button.addEventListener('click', function() {
                    const id = parseInt(this.dataset.id);
                    const item = cart.find(item => item.id === id);
                    CartManager.updateQuantity(id, item.quantity + 1);
                    displayCart();
                });
            });
            
            document.querySelectorAll('.decrease-quantity').forEach(button => {
                button.addEventListener('click', function() {
                    const id = parseInt(this.dataset.id);
                    const item = cart.find(item => item.id === id);
                    if (item.quantity > 1) {
                        CartManager.updateQuantity(id, item.quantity - 1);
                    } else {
                        CartManager.removeItem(id);
                    }
                    displayCart();
                });
            });
            
            document.querySelectorAll('.cart-item-remove').forEach(button => {
                button.addEventListener('click', function() {
                    const id = parseInt(this.dataset.id);
                    CartManager.removeItem(id);
                    displayCart();
                });
            });
        }
    </script>
</body>
</html>
