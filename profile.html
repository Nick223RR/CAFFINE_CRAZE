    <title>My Profile - Caffeine Craze</title>
    <style>

        .profile-avatar {

        .logout-button {

        }
.container-fluid{
            background-color: rgba(120, 50, 50, 0.9);
        }
.navbar-brand img {
    width: 60px;

}

    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); /* Subtle shadow */

/* Navbar Items */

    font-family: 'Arial', sans-serif; /* Clean font */

/* Icon Styling */

/* Responsive adjustments for mobile view */

</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <img src="Cafe-logo.png" alt="Cafe Logo" style="border-style: groove; border-color: black; height:80px;width:80px">
                Caffeine Craze
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            <img src="homeicon.png" alt="Home Icon" class="navbar-icon"> Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="product.html">
                            <img src="menuicon.png" alt="Menu Icon" class="navbar-icon"> Menu
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="proceed_button.html">
                            <img src="carticon.png" alt="Cart Icon" class="navbar-icon"> Order Now
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="spa.html">
                            <img src="usericon.png" alt="User Icon" class="navbar-icon"> My Profile
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1 class="heading fade-in">My Profile</h1>
        
        <div class="form-container fade-in">
            <div class="alert alert-danger" id="error-message" style="display: none;"></div>
            
            <div id="profile-content" style="display: none;">
                <div class="profile-section">
                    <div class="profile-header">
                        <div class="profile-avatar" id="profile-avatar"></div>
                        <div>
                            <div class="profile-name" id="profile-name"></div>
                            <div class="profile-email" id="profile-email  id="profile-name"></div>
                            <div class="profile-email" id="profile-email"></div>
                        </div>
                    </div>
                    
                    <h3>Account Information</h3>
                    <p>Member since: <span id="member-since"></span></p>
                    
                    <h3>Order History</h3>
                    <div id="order-history">
                        <p>No previous orders found.</p>
                    </div>
                    
                    <div class="mt-4">
                        <button id="logout-btn" class="login-button logout-button">Logout</button>
                    </div>
                </div>
            </div>
            
            <div id="not-logged-in" style="display: none;">
                <div class="profile-section text-center">
                    <h3>You are not logged in</h3>
                    <p>Please login to view your profile.</p>
                    <a href="login.html" class="login-button" style="display: inline-block; text-decoration: none; text-align: center; margin-top: 20px;">Go to Login</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-analytics.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-auth.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAQbW8GZYx8s1TClUiG7r711piLJFtrANA",
            authDomain: "caffinecraze-93d3f.firebaseapp.com",
            projectId: "caffinecraze-93d3f",
            storageBucket: "caffinecraze-93d3f.firebasestorage.app",
            messagingSenderId: "774090459612",
            appId: "1:774090459612:web:28aa1e5d3a3de8d393e719",
            measurementId: "G-Z5VTH06PF5"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);

        // Check authentication state
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // User is signed in
                document.getElementById('profile-content').style.display = "block";
                document.getElementById('not-logged-in').style.display = "none";
                
                // Display user info
                const displayName = user.displayName || 'User';
                const email = user.email;
                const creationTime = new Date(user.metadata.creationTime).toLocaleDateString();
                
                // Set profile information
                document.getElementById('profile-name').textContent = displayName;
                document.getElementById('profile-email').textContent = email;
                document.getElementById('member-since').textContent = creationTime;
                
                // Set avatar with initials
                const initials = displayName.split(' ')
                    .map(name => name.charAt(0))
                    .join('')
                    .toUpperCase();
                document.getElementById('profile-avatar').textContent = initials;
                
            } else {
                // User is not signed in
                document.getElementById('profile-content').style.display = "none";
                document.getElementById('not-logged-in').style.display = "block";
            }
        });

        // Logout functionality
        document.getElementById('logout-btn').addEventListener('click', function() {
            signOut(auth).then(() => {
                // Sign-out successful
                window.location.href = "index.html";
            }).catch((error) => {
                // An error happened
                document.getElementById('error-message').textContent = "Error signing out. Please try again.";
                document.getElementById('error-message').style.display = "block";
            });
        });
    </script>
</body>
</html>
